# DataFlow360 — composition des services
# GROUPE 2 — Sprint 0, tâche T0.4
#
# Démarrage :  docker compose up -d
# Arrêt     :  docker compose down
# Réinitialisation complète (efface les données) :  docker compose down -v

name: dataflow360

x-airflow-common: &airflow-common
  image: apache/airflow:${AIRFLOW_VERSION}
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks: [dataflow]

services:

  # ---------------------------------------------------------------
  # PostgreSQL — entrepôt, schéma intermédiaire, quarantaine
  # + base de métadonnées d'Airflow (base séparée, même instance)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: df_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [dataflow]

  # ---------------------------------------------------------------
  # MongoDB — catalogue produits et avis clients
  # ---------------------------------------------------------------
  mongodb:
    image: mongo:${MONGO_VERSION}
    container_name: df_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [dataflow]

  # ---------------------------------------------------------------
  # Elasticsearch — index lexical du catalogue et index vectoriel
  # Nœud unique, sécurité désactivée : environnement de développement
  # ---------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    container_name: df_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"     # à ne pas augmenter sans raison
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [dataflow]

  # ---------------------------------------------------------------
  # Kafka — bus d'événements de navigation et commandes rejouées
  # Mode KRaft : pas de service de coordination externe
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: df_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168        # 7 jours : Kafka sert aussi de tampon
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${KAFKA_PORT}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [dataflow]

  # ---------------------------------------------------------------
  # Airflow — orchestration de la chaîne quotidienne
  # ---------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: df_airflow_init
    entrypoint: /bin/bash
     # Airflow épinglé en version 2 : la version 3 change les commandes
    # webserver et users create. Ne pas monter de version sans les adapter.
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_USER} --password ${AIRFLOW_PASSWORD} \
          --firstname Groupe --lastname Deux --role Admin --email groupe2@dataflow360.local

  airflow-webserver:
    <<: *airflow-common
    container_name: df_airflow_web
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: df_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Conteneur de travail — scripts de collecte, qualité, transformation
  # Le code est monté, pas copié : pas de reconstruction à chaque édition
  # ---------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: df_app
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      ES_URL: http://elasticsearch:9200
      KAFKA_BOOTSTRAP: kafka:9092
      PYTHONPATH: /app/src
      DRIVE_OLIST_ID: ${DRIVE_OLIST_ID}
      DRIVE_RAKUTEN_ID: ${DRIVE_RAKUTEN_ID}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./tests:/app/tests
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    command: ["sleep", "infinity"]     # conteneur de travail, pas de service long
    networks: [dataflow]

volumes:
  postgres_data:
  mongo_data:
  es_data:
  kafka_data:
  airflow_logs:

networks:
  dataflow:
    driver: bridge
