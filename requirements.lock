# DataFlow360 — versions exactes, figées pour reproduire l'environnement
#
# Généré dans l'image de l'application (python:3.11-slim, Python 3.11.16) :
#   docker run --rm -v "$PWD:/r:ro" python:3.11-slim sh -c \
#     "pip install -q -r /r/requirements.txt -r /r/requirements-dev.txt \
#      && pip freeze --exclude pip --exclude setuptools --exclude wheel"
#
# Ce fichier n'est pas une liste de besoins : il s'applique comme contrainte
# (pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock),
# dans le Dockerfile et dans la CI. Une dépendance entre toujours par
# requirements.txt ; le lock est régénéré dans la même demande de fusion.
